name: Weekly VN rates → Telegram

on:
  workflow_dispatch:
  schedule:
    # Saturday 02:00 UTC = Saturday 09:00 Asia/Bangkok.
    - cron: "0 2 * * 6"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Bangkok
      PYTHONUNBUFFERED: "1"
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      REPORT_URL: ${{ secrets.REPORT_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Resolve last completed ISO week
        id: week
        shell: bash
        run: echo "value=$(date -d '7 days ago' +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore Telegram delivery state
        uses: actions/cache@v4
        with:
          path: |
            output/.telegram_publish_state.json
            output/sources_cache
          key: weekly-state-${{ github.ref_name }}-${{ github.run_number }}
          restore-keys: |
            weekly-state-${{ github.ref_name }}-
          save-always: true

      - name: Pre-seed source cache from repository
        shell: bash
        run: |
          mkdir -p output/sources_cache
          if [ -d "data/sources_cache" ]; then
            cp data/sources_cache/*.txt output/sources_cache/ 2>/dev/null || true
          fi

      - name: Run, audit and publish
        run: |
          python scripts/run_pipeline.py \
            --week "${{ steps.week.outputs.value }}" \
            --out ./output \
            --publish-telegram \
            --telegram-no-document

      - name: Publish verified facts feed and cache
        shell: bash
        run: |
          mkdir -p data/sources_cache
          cp output/rates_feed_latest.json data/rates_feed_latest.json 2>/dev/null || true
          cp output/sources_cache/*.txt data/sources_cache/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rates_feed_latest.json data/sources_cache
          git diff --cached --quiet && exit 0
          git commit -m "data: update verified VN rates feed and cache"
          git push
